name: industrial-monitoring-pipeline

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  modbus-sim:
    build: ./simulator
    container_name: modbus-sim
    ports:
      - "127.0.0.1:5020:5020"
    restart: unless-stopped